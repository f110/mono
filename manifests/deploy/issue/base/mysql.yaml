apiVersion: v1
kind: Service
metadata:
  name: issue-mysql
  labels:
    app.kubernetes.io/name: issue
    app.kubernetes.io/component: mysql
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: issue
    app.kubernetes.io/component: mysql
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: issue-mysql
  labels:
    app.kubernetes.io/name: issue
    app.kubernetes.io/component: mysql
spec:
  serviceName: issue-mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: issue
      app.kubernetes.io/component: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: issue
        app.kubernetes.io/component: mysql
    spec:
      containers:
        - name: mysql
          image: mariadb:11.7.2
          env:
            - name: MARIADB_ROOT_PASSWORD
              value: root
            - name: MARIADB_DATABASE
              value: issue
            - name: MARIADB_USER
              value: issue
            - name: MARIADB_PASSWORD
              value: issue
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
