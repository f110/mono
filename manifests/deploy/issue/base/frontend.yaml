apiVersion: v1
kind: Service
metadata:
  name: issue-frontend
  labels:
    app.kubernetes.io/name: issue
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: issue
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: issue-frontend
  labels:
    app.kubernetes.io/name: issue
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: issue
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: issue
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: repo.center.x.f110.dev/issue/frontend
          ports:
            - name: http
              containerPort: 8090
          livenessProbe:
            httpGet:
              path: /_healthz
              port: http
          readinessProbe:
            httpGet:
              path: /_healthz
              port: http
