apiVersion: v1
kind: Service
metadata:
  name: issue-server
  labels:
    app.kubernetes.io/name: issue
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: issue
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: issue-server
  labels:
    app.kubernetes.io/name: issue
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: issue
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: issue
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: repo.center.x.f110.dev/issue/server
          args:
            - --addr=:8080
            - --dsn=issue:issue@tcp(issue-mysql:3306)/issue
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /_livez
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /_livez
              port: http
          readinessProbe:
            httpGet:
              path: /_readyz
              port: http
