apiVersion: v1
kind: Service
metadata:
  name: doc-search-service
  labels:
    app.kubernetes.io/name: repo-doc
    app.kubernetes.io/component: doc-search-service
spec:
  selector:
    app.kubernetes.io/name: repo-doc
    app.kubernetes.io/component: doc-search-service
  ports:
    - name: grpc
      port: 8067
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-search-service
  labels:
    app.kubernetes.io/name: repo-doc
    app.kubernetes.io/component: doc-search-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: repo-doc
      app.kubernetes.io/component: doc-search-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: repo-doc
        app.kubernetes.io/component: doc-search-service
    spec:
      containers:
        - name: doc-search-service
          image: repo.center.x.f110.dev/repo-doc/doc-search-service
          args:
            - --listen=:8067
            - --insecure
          ports:
            - name: grpc
              containerPort: 8067
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: grpc
          readinessProbe:
            grpc:
              port: 8067
              service: doc-search
