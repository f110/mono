syntax = "proto3";

package issue.schema;

import "ddl.proto";
import "google/protobuf/timestamp.proto";

option go_package = "go.f110.dev/mono/go/issue/database;database";

enum TicketStatus {
  TICKET_STATUS_OPEN        = 0;
  TICKET_STATUS_IN_PROGRESS = 1;
  TICKET_STATUS_DONE        = 2;
  TICKET_STATUS_WONT_FIX    = 3;
}

// Priority of the ticket. PRIORITY_NONE means that the priority is not set.
enum Priority {
  PRIORITY_NONE = 0;
  PRIORITY_P0   = 1;
  PRIORITY_P1   = 2;
  PRIORITY_P2   = 3;
  PRIORITY_P3   = 4;
  PRIORITY_P4   = 5;
}

enum ActorKind {
  ACTOR_KIND_HUMAN  = 0;
  ACTOR_KIND_AGENT  = 1;
  ACTOR_KIND_SYSTEM = 2;
}

enum RelationType {
  RELATION_TYPE_PARENT_OF    = 0;
  RELATION_TYPE_BLOCKS       = 1;
  RELATION_TYPE_DUPLICATE_OF = 2;
  RELATION_TYPE_RELATES_TO   = 3;
}

enum TrailerKind {
  TRAILER_KIND_REFS  = 0;
  TRAILER_KIND_FIXES = 1;
}

enum PullRequestState {
  PULL_REQUEST_STATE_OPEN   = 0;
  PULL_REQUEST_STATE_CLOSED = 1;
  PULL_REQUEST_STATE_MERGED = 2;
}

// GithubEventState is the same as the state of go/github/webhook.
enum GithubEventState {
  GITHUB_EVENT_STATE_PENDING    = 0;
  GITHUB_EVENT_STATE_PROCESSING = 1;
  GITHUB_EVENT_STATE_SUCCEEDED  = 2;
  GITHUB_EVENT_STATE_FAILED     = 3;
  GITHUB_EVENT_STATE_EXPIRED    = 4;
  GITHUB_EVENT_STATE_SKIPPED    = 5;
}

enum ActivityKind {
  ACTIVITY_KIND_CREATE              = 0;
  ACTIVITY_KIND_TITLE               = 1;
  ACTIVITY_KIND_STATUS              = 2;
  ACTIVITY_KIND_PRIORITY            = 3;
  ACTIVITY_KIND_COMPONENT           = 4;
  ACTIVITY_KIND_ASSIGNEE            = 5;
  ACTIVITY_KIND_BODY                = 6;
  ACTIVITY_KIND_RELATION_ADDED      = 7;
  ACTIVITY_KIND_RELATION_REMOVED    = 8;
  ACTIVITY_KIND_COMMENT             = 9;
  ACTIVITY_KIND_COMMENT_EDITED      = 10;
  ACTIVITY_KIND_COMMENT_DELETED     = 11;
  ACTIVITY_KIND_COMMIT_LINKED       = 12;
  ACTIVITY_KIND_PULL_REQUEST_LINKED = 13;
}

// Actor is a subject of the operations. kind and owner_id are never changed after the actor is created.
message Actor {
  int32     id   = 1 [(dev.f110.ddl.column) = { sequence: true }];
  ActorKind kind = 2;
  string    name = 3;
  // owner_id is the id of the human actor who owns the agent. Set only for the agent.
  int32 owner_id = 4 [(dev.f110.ddl.column) = { null: true }];
  // subject is the user id of heimdallr. Set only for the human.
  string subject = 5 [(dev.f110.ddl.column) = { null: true, unique: true }];

  option (dev.f110.ddl.table) = {
    primary_key: "id"
    with_timestamp: true
  };

  option (dev.f110.ddl.dao) = {
    queries: {
      name: "All"
      query: "SELECT * FROM `:table_name:`"
    }
    queries: {
      name: "BySubject"
      query: "SELECT * FROM `:table_name:` WHERE `subject` = ?"
    }
    queries: {
      name: "ByKind"
      query: "SELECT * FROM `:table_name:` WHERE `kind` = ?"
    }
  };
}

message Component {
  int32  id   = 1 [(dev.f110.ddl.column) = { sequence: true }];
  string name = 2 [(dev.f110.ddl.column) = { unique: true }];

  option (dev.f110.ddl.table) = {
    primary_key: "id"
    with_timestamp: true
  };

  option (dev.f110.ddl.dao) = {
    queries: {
      name: "All"
      query: "SELECT * FROM `:table_name:`"
    }
  };
}

// Ticket is an issue. id is used as the ticket number.
message Ticket {
  int32        id           = 1 [(dev.f110.ddl.column) = { sequence: true }];
  string       title        = 2;
  string       body         = 3 [(dev.f110.ddl.column) = { type: "text" }];
  TicketStatus status       = 4;
  Priority     priority     = 5;
  int32        component_id = 6 [(dev.f110.ddl.column) = { null: true }];
  int32        assignee_id  = 7 [(dev.f110.ddl.column) = { null: true }];
  Actor        reporter     = 8;
  // last_activity_at is the time of the last operation to the ticket including the comments.
  google.protobuf.Timestamp last_activity_at = 9;

  option (dev.f110.ddl.table) = {
    primary_key: "id"
    with_timestamp: true
    indexes: {
      name: "idx_status"
      columns: "status"
    }
    indexes: {
      name: "idx_last_activity_at"
      columns: "last_activity_at"
    }
  };
}

// TicketBodyRevision is the body before an edit. Only the latest body is kept as the full text in Ticket, and patch
// restores the body before the edit from the body after the edit.
message TicketBodyRevision {
  int32  id     = 1 [(dev.f110.ddl.column) = { sequence: true }];
  Ticket ticket = 2;
  string patch  = 3 [(dev.f110.ddl.column) = { type: "text" }];

  option (dev.f110.ddl.table) = {
    primary_key: "id"
    with_timestamp: true
    indexes: {
      name: "idx_ticket"
      columns: "ticket"
    }
  };

  option (dev.f110.ddl.dao) = {
    queries: {
      name: "ByTicketId"
      query: "SELECT * FROM `:table_name:` WHERE `ticket_id` = ?"
    }
  };
}

// Relation is a directed relation between the tickets. The reverse direction is derived at display time.
// relates_to is stored as from < to because it is symmetric.
message Relation {
  int32        id   = 1 [(dev.f110.ddl.column) = { sequence: true }];
  Ticket       from          = 2;
  RelationType relation_type = 3;
  Ticket       to            = 4;

  option (dev.f110.ddl.table) = {
    primary_key: "id"
    with_timestamp: true
    indexes: {
      name: "uniq_relation"
      columns: "from"
      columns: "relation_type"
      columns: "to"
      unique: true
    }
    indexes: {
      name: "idx_to"
      columns: "to"
    }
  };

  option (dev.f110.ddl.dao) = {
    queries: {
      name: "ByFromId"
      query: "SELECT * FROM `:table_name:` WHERE `from_id` = ?"
    }
    queries: {
      name: "ByToId"
      query: "SELECT * FROM `:table_name:` WHERE `to_id` = ?"
    }
    queries: {
      name: "ByFromIdAndRelationTypeAndToId"
      query: "SELECT * FROM `:table_name:` WHERE `from_id` = ? AND `relation_type` = ? AND `to_id` = ?"
    }
  };
}

// Comment is removed logically by deleted_at because the activities keep referring it.
message Comment {
  int32                     id         = 1 [(dev.f110.ddl.column) = { sequence: true }];
  Ticket                    ticket     = 2;
  Actor                     actor      = 3;
  string                    body       = 4 [(dev.f110.ddl.column) = { type: "text" }];
  google.protobuf.Timestamp deleted_at = 5 [(dev.f110.ddl.column) = { null: true }];

  option (dev.f110.ddl.table) = {
    primary_key: "id"
    with_timestamp: true
    indexes: {
      name: "idx_ticket"
      columns: "ticket"
    }
  };

  option (dev.f110.ddl.dao) = {
    queries: {
      name: "ByTicketId"
      query: "SELECT * FROM `:table_name:` WHERE `ticket_id` = ?"
    }
  };
}

// CommentRevision is the comment before an edit. Only the latest body is kept as the full text in Comment, and patch
// restores the body before the edit from the body after the edit.
message CommentRevision {
  int32   id      = 1 [(dev.f110.ddl.column) = { sequence: true }];
  Comment comment = 2;
  string  patch   = 3 [(dev.f110.ddl.column) = { type: "text" }];

  option (dev.f110.ddl.table) = {
    primary_key: "id"
    with_timestamp: true
    indexes: {
      name: "idx_comment"
      columns: "comment"
    }
  };

  option (dev.f110.ddl.dao) = {
    queries: {
      name: "ByCommentId"
      query: "SELECT * FROM `:table_name:` WHERE `comment_id` = ?"
    }
  };
}

// Activity is the history of the operations to the ticket.
message Activity {
  int32        id         = 1 [(dev.f110.ddl.column) = { sequence: true }];
  Ticket       ticket     = 2;
  Actor        actor      = 3;
  ActivityKind kind       = 4;
  string       from_value = 5 [(dev.f110.ddl.column) = { type: "text" }];
  string       to_value   = 6 [(dev.f110.ddl.column) = { type: "text" }];
  int32        ref_id     = 7 [(dev.f110.ddl.column) = { null: true }];

  option (dev.f110.ddl.table) = {
    primary_key: "id"
    with_timestamp: true
    indexes: {
      name: "idx_ticket"
      columns: "ticket"
    }
  };

  option (dev.f110.ddl.dao) = {
    queries: {
      name: "ByTicketId"
      query: "SELECT * FROM `:table_name:` WHERE `ticket_id` = ?"
    }
  };
}

// CommitLink is the commit which refers to the ticket by the trailer. repository_id is the id of the repository of
// Build. change_id is filled after git-data-service fetches the commit.
message CommitLink {
  int32                     id            = 1 [(dev.f110.ddl.column) = { sequence: true }];
  Ticket                    ticket        = 2;
  int32                     repository_id = 3;
  string                    sha           = 4 [(dev.f110.ddl.column) = { size: 40 }];
  string                    change_id     = 5 [(dev.f110.ddl.column) = { size: 64, null: true }];
  string                    subject       = 6 [(dev.f110.ddl.column) = { type: "text" }];
  string                    author        = 7;
  TrailerKind               trailer       = 8;
  google.protobuf.Timestamp committed_at  = 9;

  option (dev.f110.ddl.table) = {
    primary_key: "id"
    with_timestamp: true
    indexes: {
      name: "uniq_commit"
      columns: "ticket"
      columns: "repository_id"
      columns: "sha"
      unique: true
    }
  };

  option (dev.f110.ddl.dao) = {
    queries: {
      name: "ByTicketId"
      query: "SELECT * FROM `:table_name:` WHERE `ticket_id` = ?"
    }
    queries: {
      name: "ByTicketIdAndRepositoryIdAndSha"
      query: "SELECT * FROM `:table_name:` WHERE `ticket_id` = ? AND `repository_id` = ? AND `sha` = ?"
    }
  };
}

// PullRequestLink is the pull request which has the commit referring to the ticket by the trailer. repository_id is the
// id of the repository of Build.
message PullRequestLink {
  int32            id            = 1 [(dev.f110.ddl.column) = { sequence: true }];
  Ticket           ticket        = 2;
  int32            repository_id = 3;
  int32            number        = 4;
  string           title         = 5 [(dev.f110.ddl.column) = { type: "text" }];
  string           author        = 6;
  PullRequestState state         = 7;
  string           head_sha      = 8 [(dev.f110.ddl.column) = { size: 40 }];

  option (dev.f110.ddl.table) = {
    primary_key: "id"
    with_timestamp: true
    indexes: {
      name: "uniq_pull_request"
      columns: "ticket"
      columns: "repository_id"
      columns: "number"
      unique: true
    }
    indexes: {
      name: "idx_repository_number"
      columns: "repository_id"
      columns: "number"
    }
  };

  option (dev.f110.ddl.dao) = {
    queries: {
      name: "ByTicketId"
      query: "SELECT * FROM `:table_name:` WHERE `ticket_id` = ?"
    }
    queries: {
      name: "ByRepositoryIdAndNumber"
      query: "SELECT * FROM `:table_name:` WHERE `repository_id` = ? AND `number` = ?"
    }
  };
}

// GithubEvent is the webhook delivery from GitHub. The columns are the same as github_event of Build.
message GithubEvent {
  int32            id          = 1 [(dev.f110.ddl.column) = { sequence: true }];
  string           delivery_id = 2 [(dev.f110.ddl.column) = { size: 64 }];
  string           event_type  = 3 [(dev.f110.ddl.column) = { size: 64 }];
  string           action      = 4 [(dev.f110.ddl.column) = { size: 64 }];
  bytes            payload     = 5 [(dev.f110.ddl.column) = { type: "medium" }];
  GithubEventState state       = 6;
  bytes            status      = 7;
  string           last_error  = 8 [(dev.f110.ddl.column) = { type: "text" }];

  option (dev.f110.ddl.table) = {
    primary_key: "id"
    with_timestamp: true
    indexes: {
      name: "uniq_delivery_id"
      columns: "delivery_id"
      unique: true
    }
    indexes: {
      name: "idx_state"
      columns: "state"
    }
  };

  option (dev.f110.ddl.dao) = {
    queries: {
      name: "ByState"
      query: "SELECT * FROM `:table_name:` WHERE `state` = ? ORDER BY `id`"
    }
  };
}
