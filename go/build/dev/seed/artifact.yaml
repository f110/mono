# Seed for the build app's `artifact` table.
#
# Deliverables produced by the seeded trunk build in task.yaml (task_id 9001 =
# linux_amd64, 9002 = linux_arm64). Covers all three ArtifactType values
# (0=container_image, 1=binary, 2=k8s_manifest).
#
# Storage conventions mirror what the collect sidecar records, so the dashboard
# renders realistically: container images carry the `sha256:` manifest digest in
# `hash` and a mutable tag ("latest") in `reference`; binaries and k8s manifests
# store a bare hex sha256 in `hash` (the BFF normalizes it to `sha256:` for the
# digest-first display) and are addressed by a content digest in `reference`
# (untagged). `repository` is the registry path; the host comes from the
# builder's --artifact-registry (ServerConfig.artifact_registry_host).
