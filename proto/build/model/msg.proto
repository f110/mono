edition = "2023";

package mono.build.model;

import "google/protobuf/go_features.proto";
import "google/protobuf/timestamp.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package                 = "go.f110.dev/mono/go/build/model";

enum TestStatus {
  TEST_STATUS_PASSED = 0;
  TEST_STATUS_FLAKY  = 1;
  TEST_STATUS_FAILED = 2;
}

// ArtifactType classifies a deliverable. The values match the DB enum
// (build.schema.ArtifactType) so the mapping in Go is a direct cast.
enum ArtifactType {
  ARTIFACT_TYPE_CONTAINER_IMAGE = 0;
  ARTIFACT_TYPE_BINARY          = 1;
  ARTIFACT_TYPE_K8S_MANIFEST    = 2;
}

message Repository {
  int32  id        = 1;
  string name      = 2;
  string url       = 3;
  string clone_url = 4;
  bool private     = 5;
  // Full commit SHA at the tip of default_branch. Populated only when the API
  // server has access to git-data-service; empty otherwise. Clients shorten
  // this for display.
  string head_revision = 7;
}

message Task {
  int32                     id                       = 1;
  int32                     repository_id            = 2;
  string                    job_name                 = 3;
  string                    parsed_job_configuration = 4;
  string                    revision                 = 5;
  string                    bazel_version            = 6;
  string                    command                  = 7;
  bool                      is_trunk                 = 8;
  bool                      success                  = 9;
  string                    log_file                 = 10;
  repeated string           targets                  = 11;
  string                    platform                 = 12;
  string                    via                      = 13;
  string                    config_name              = 14;
  string                    node                     = 15;
  string                    manifest                 = 16;
  string                    container                = 17;
  int32                     executed_tests_count     = 18;
  int32                     succeeded_tests_count    = 19;
  google.protobuf.Timestamp start_at                 = 20;
  google.protobuf.Timestamp finished_at              = 21;
  google.protobuf.Timestamp created_at               = 22;
  google.protobuf.Timestamp updated_at               = 23;
  string                    repository_url           = 24;
  string                    revision_url             = 25;
  string                    cpu_limit                = 26;
  string                    memory_limit             = 27;
  repeated TestReport       test_reports             = 28;
  BuildMetrics              build_metrics            = 29;
}

message Job {
  string            name          = 1;
  int32             repository_id = 2;
  repeated JobParam params        = 3;
}

message JobParam {
  string name        = 1;
  string description = 2;
  bool   required    = 3;
}

// Artifact is a deliverable produced by a Task and stored in the OCI registry
// (zot). `hash` is the immutable content digest (image manifest digest, or the
// sha256 of a file). `reference` is where the content is addressable in the
// registry: a tag, or the content digest when untagged. See docs/build.md.
message Artifact {
  int32                     id         = 1;
  int32                     task_id    = 2;
  ArtifactType              type       = 3;
  string                    hash       = 4;
  string                    name       = 5;
  string                    repository = 6;
  string                    reference  = 7;
  int64                     size       = 8;
  google.protobuf.Timestamp created_at = 9;
}

message TestReport {
  string     label    = 1;
  TestStatus status   = 2;
  int64      duration = 3;
}

// BuildMetrics mirrors the build-wide statistics stored for a Task. It is a
// scalar-only, flattened view of Bazel's BuildMetrics event.
message BuildMetrics {
  int64 remote_cache_hits                 = 1;
  int64 wall_time_ms                      = 2;
  int64 cpu_time_ms                       = 3;
  int64 analysis_phase_time_ms            = 4;
  int64 execution_phase_time_ms           = 5;
  int64 actions_created                   = 6;
  int64 actions_executed                  = 7;
  int64 graph_action_count                = 8;
  int64 output_artifact_count             = 9;
  int64 skyframe_node_count               = 10;
  int64 targets_configured                = 11;
  int64 packages_loaded                   = 12;
  int64 source_artifacts_read_bytes       = 13;
  int64 source_artifacts_read_count       = 14;
  int64 output_artifacts_seen_bytes       = 15;
  int64 output_artifacts_seen_count       = 16;
  int64 output_artifacts_from_cache_bytes = 17;
  int64 output_artifacts_from_cache_count = 18;
}

// GithubEvent surfaces a row from the `github_event` table for the dashboard.
// The `state` field carries the proto enum name ("PENDING", "SUCCEEDED", …)
// so the frontend does not have to know the numeric mapping. `status` is the
// reconciler's progress JSON serialized as a string — the dashboard renders
// it raw, since the document's shape depends on event_type.
message GithubEvent {
  int32                     id          = 1;
  string                    delivery_id = 2;
  string                    event_type  = 3;
  string                    action      = 4;
  string                    state       = 5;
  string                    status      = 6;
  string                    last_error  = 7;
  google.protobuf.Timestamp created_at  = 8;
  google.protobuf.Timestamp updated_at  = 9;
  // Repository is the full_name (e.g. "owner/repo") parsed out of the
  // webhook payload at read time. Empty when the payload has no
  // repository field or is malformed.
  string repository     = 10;
  string repository_url = 11;
}

message ExternalReleaseTrigger {
  int32  id                 = 1;
  int32  repository_id      = 2;
  string repository_name    = 3;
  string repository_url     = 4;
  string job_name           = 5;
  string provider           = 6;
  string external_repo      = 7;
  string external_repo_url  = 8;
  string kind               = 9;
  string tag_pattern        = 10;
  bool   include_prerelease = 11;
}
