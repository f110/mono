edition = "2023";

package mono.codexel;

import "google/protobuf/go_features.proto";

option features.(pb.go).api_level = API_OPAQUE;
option go_package                 = "go.f110.dev/mono/go/codexel/api";

// AgentService provides the coding agents running in herdr.
service AgentService {
  rpc ListAgents(RequestListAgents) returns (ResponseListAgents);
  // WatchAgents sends all agents at first and every time the agents change.
  rpc WatchAgents(RequestWatchAgents) returns (stream ResponseWatchAgents);
  // ReadOutput returns the recent terminal output of the agent including ANSI escape sequences.
  rpc ReadOutput(RequestReadOutput) returns (ResponseReadOutput);
  rpc SendPrompt(RequestSendPrompt) returns (ResponseSendPrompt);
  rpc SendKeys(RequestSendKeys) returns (ResponseSendKeys);
  // FocusAgent moves the focus of herdr to the agent.
  rpc FocusAgent(RequestFocusAgent) returns (ResponseFocusAgent);
  rpc ListWorkspaces(RequestListWorkspaces) returns (ResponseListWorkspaces);
  // StartAgent creates a new tab in the workspace and starts the agent in it.
  rpc StartAgent(RequestStartAgent) returns (ResponseStartAgent);
}

enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_IDLE        = 1;
  AGENT_STATUS_WORKING     = 2;
  AGENT_STATUS_BLOCKED     = 3;
  AGENT_STATUS_DONE        = 4;
  AGENT_STATUS_UNKNOWN     = 5;
}

message Agent {
  // pane_id identifies the agent in herdr.
  string pane_id         = 1;
  string workspace_id    = 2;
  string workspace_label = 3;
  string tab_id          = 4;
  // kind is the kind of the agent (e.g. claude).
  string kind = 5;
  // session_id is the session ID of the agent itself. It is the value of the Agent-Session trailer.
  string      session_id = 6;
  AgentStatus status     = 7;
  string      cwd        = 8;
  string      title      = 9;
  bool        focused    = 10;
}

message Workspace {
  string workspace_id = 1;
  string label        = 2;
}

message RequestListAgents {}

message ResponseListAgents {
  repeated Agent agents = 1;
}

message RequestWatchAgents {}

message ResponseWatchAgents {
  repeated Agent agents = 1;
}

message RequestReadOutput {
  string pane_id = 1;
  // lines is the number of the lines to read including the history. 0 means the default of herdr. The history of the
  // agent using the alternate screen can be read only while it is idle, so only the screen is returned while it works.
  int32 lines = 2;
}

message ResponseReadOutput {
  string text = 1;
}

message RequestSendPrompt {
  string pane_id = 1;
  string text    = 2;
}

message ResponseSendPrompt {}

message RequestSendKeys {
  string          pane_id = 1;
  repeated string keys    = 2;
}

message ResponseSendKeys {}

message RequestFocusAgent {
  string pane_id = 1;
}

message ResponseFocusAgent {}

message RequestListWorkspaces {}

message ResponseListWorkspaces {
  repeated Workspace workspaces = 1;
}

message RequestStartAgent {
  string workspace_id = 1;
  // cwd is the working directory of the agent. The default of herdr is used if it is empty.
  string cwd = 2;
  // kind is the kind of the agent supported by herdr (e.g. claude).
  string          kind = 3;
  string          name = 4;
  repeated string args = 5;
}

message ResponseStartAgent {
  Agent agent = 1;
}

// RepositoryService manages the repositories opened in Codexel. The repositories are saved in the config file.
service RepositoryService {
  rpc ListRepositories(RequestListRepositories) returns (ResponseListRepositories);
  // ListCandidates returns the repositories where the agents work and which are not opened.
  rpc ListCandidates(RequestListCandidates) returns (ResponseListCandidates);
  // OpenRepository opens the workspace which contains the path.
  rpc OpenRepository(RequestOpenRepository) returns (ResponseOpenRepository);
  rpc CloseRepository(RequestCloseRepository) returns (ResponseCloseRepository);
  // WatchRepository sends the ID of the operation at first and every time the operation changes. The working copy is
  // snapshotted periodically while watching.
  rpc WatchRepository(RequestWatchRepository) returns (stream ResponseWatchRepository);
}

// RevisionService provides the revisions of the repository.
service RevisionService {
  rpc Log(RequestLog) returns (ResponseLog);
  // GetRevision returns the commit with the whole description and the diff of the revision.
  rpc GetRevision(RequestGetRevision) returns (ResponseGetRevision);
  // The operations below return the message of jj in output.
  // New creates the new revision on the revisions.
  rpc New(RequestNew) returns (ResponseNew);
  // Edit makes the revision the working copy.
  rpc Edit(RequestEdit) returns (ResponseEdit);
  rpc Abandon(RequestAbandon) returns (ResponseAbandon);
  rpc Describe(RequestDescribe) returns (ResponseDescribe);
  // Commit describes the working copy and creates the new working copy on it.
  rpc Commit(RequestCommit) returns (ResponseCommit);
  // Undo undoes the last operation.
  rpc Undo(RequestUndo) returns (ResponseUndo);
  rpc Rebase(RequestRebase) returns (ResponseRebase);
  // Squash moves the changes of the revisions into the destination.
  rpc Squash(RequestSquash) returns (ResponseSquash);
  // Evolog returns the versions of the revision from the newest.
  rpc Evolog(RequestEvolog) returns (ResponseEvolog);
  // Split moves the files into the new revision before the revision.
  rpc Split(RequestSplit) returns (ResponseSplit);
  // Restore discards the changes of the files in the revision.
  rpc Restore(RequestRestore) returns (ResponseRestore);
  // DiffRange returns the diff between two revisions.
  rpc DiffRange(RequestDiffRange) returns (ResponseDiffRange);
}

message Repository {
  // path is the root of the workspace. It identifies the repository.
  string path = 1;
  string name = 2;
}

message RemoteBookmark {
  string name   = 1;
  string remote = 2;
}

message Trailer {
  string key   = 1;
  string value = 2;
}

message Commit {
  string change_id = 1;
  // change_id_prefix is the shortest unique prefix of change_id.
  string change_id_prefix = 2;
  string commit_id        = 3;
  // commit_id_prefix is the shortest unique prefix of commit_id.
  string commit_id_prefix = 4;
  // description is the first line of the description.
  string description = 5;
  string author      = 6;
  string email       = 7;
  // timestamp is the unix time of the committer.
  int64                   timestamp            = 8;
  bool                    current_working_copy = 9;
  bool                    immutable            = 10;
  bool                    conflict             = 11;
  bool                    empty                = 12;
  bool                    divergent            = 13;
  bool                    hidden               = 14;
  repeated string         parents              = 15;
  repeated string         local_bookmarks      = 16;
  repeated RemoteBookmark remote_bookmarks     = 17;
  repeated Trailer        trailers             = 18;
}

// GraphLine is a line of the graph. gutter is the characters of the graph.
message GraphLine {
  string gutter  = 1;
  string content = 2;
  bool   node    = 3;
}

// LogRow is a commit and the lines of the graph. lines starts with the line of the node.
message LogRow {
  Commit             commit = 1;
  repeated GraphLine lines  = 2;
}

message RequestListRepositories {}

message ResponseListRepositories {
  repeated Repository repositories = 1;
}

message RequestListCandidates {}

message ResponseListCandidates {
  repeated Repository repositories = 1;
}

message RequestOpenRepository {
  string path = 1;
}

message ResponseOpenRepository {
  Repository repository = 1;
}

message RequestCloseRepository {
  string path = 1;
}

message ResponseCloseRepository {}

message RequestWatchRepository {
  string path = 1;
}

message ResponseWatchRepository {
  string operation_id = 1;
}

message RequestLog {
  string path = 1;
  // revset is the revset to show. The default of jj is used if it is empty.
  string revset = 2;
  // limit is the maximum number of the revisions. 0 means no limit.
  int32 limit = 3;
}

message ResponseLog {
  repeated LogRow rows = 1;
}

enum FileStatus {
  FILE_STATUS_UNSPECIFIED = 0;
  FILE_STATUS_MODIFIED    = 1;
  FILE_STATUS_ADDED       = 2;
  FILE_STATUS_DELETED     = 3;
  FILE_STATUS_RENAMED     = 4;
  FILE_STATUS_COPIED      = 5;
}

enum DiffLineKind {
  DIFF_LINE_KIND_UNSPECIFIED = 0;
  DIFF_LINE_KIND_CONTEXT     = 1;
  DIFF_LINE_KIND_ADDED       = 2;
  DIFF_LINE_KIND_REMOVED     = 3;
}

message DiffLine {
  DiffLineKind kind = 1;
  string       text = 2;
  // old_line and new_line are the line numbers in the old and the new file. 0 means the line doesn't exist in it.
  int32 old_line = 3;
  int32 new_line = 4;
  // no_newline is true if the line is the end of the file without the newline.
  bool no_newline = 5;
}

message Hunk {
  int32 old_start = 1;
  int32 old_lines = 2;
  int32 new_start = 3;
  int32 new_lines = 4;
  // section is the text after the range of the header of the hunk.
  string            section = 5;
  repeated DiffLine lines   = 6;
}

message FileDiff {
  string path = 1;
  // old_path is the path before the rename or the copy.
  string        old_path = 2;
  FileStatus    status   = 3;
  bool          binary   = 4;
  repeated Hunk hunks    = 5;
  int32         added    = 6;
  int32         removed  = 7;
}

message RequestGetRevision {
  string path = 1;
  // revision is the commit ID because the change ID may be divergent.
  string revision = 2;
}

message ResponseGetRevision {
  Commit commit = 1;
  // description is the whole description.
  string            description = 2;
  repeated FileDiff files       = 3;
}

message RequestNew {
  string          path      = 1;
  repeated string revisions = 2;
}

message ResponseNew {
  string output = 1;
}

message RequestEdit {
  string path     = 1;
  string revision = 2;
}

message ResponseEdit {
  string output = 1;
}

message RequestAbandon {
  string          path      = 1;
  repeated string revisions = 2;
}

message ResponseAbandon {
  string output = 1;
}

message RequestDescribe {
  string path        = 1;
  string revision    = 2;
  string description = 3;
}

message ResponseDescribe {
  string output = 1;
}

message RequestCommit {
  string path        = 1;
  string description = 2;
}

message ResponseCommit {
  string output = 1;
}

message RequestUndo {
  string path = 1;
}

message ResponseUndo {
  string output = 1;
}

enum RebaseSource {
  REBASE_SOURCE_UNSPECIFIED = 0;
  // REBASE_SOURCE_REVISIONS rebases only the revisions (-r).
  REBASE_SOURCE_REVISIONS = 1;
  // REBASE_SOURCE_DESCENDANTS rebases the revisions and the descendants (-s).
  REBASE_SOURCE_DESCENDANTS = 2;
  // REBASE_SOURCE_BRANCH rebases the whole branch relative to the destination (-b).
  REBASE_SOURCE_BRANCH = 3;
}

enum RebaseTarget {
  REBASE_TARGET_UNSPECIFIED   = 0;
  REBASE_TARGET_ONTO          = 1;
  REBASE_TARGET_INSERT_AFTER  = 2;
  REBASE_TARGET_INSERT_BEFORE = 3;
}

message RequestRebase {
  string          path         = 1;
  repeated string revisions    = 2;
  RebaseSource    source       = 3;
  repeated string destinations = 4;
  RebaseTarget    target       = 5;
}

message ResponseRebase {
  string output = 1;
}

message RequestSquash {
  string          path      = 1;
  repeated string revisions = 2;
  string          into      = 3;
  // description becomes the description of the destination. The description of the destination is kept if it is
  // empty.
  string description = 4;
}

message ResponseSquash {
  string output = 1;
}

// BookmarkService manages the bookmarks. The operations return the message of jj in output.
service BookmarkService {
  rpc ListBookmarks(RequestListBookmarks) returns (ResponseListBookmarks);
  // SetBookmark creates the bookmark or moves it to the revision.
  rpc SetBookmark(RequestSetBookmark) returns (ResponseSetBookmark);
  // MoveBookmark moves the bookmark to the revision even if it moves backwards or sideways.
  rpc MoveBookmark(RequestMoveBookmark) returns (ResponseMoveBookmark);
  // DeleteBookmark deletes the bookmark. The tracked remote bookmarks are deleted on the next push.
  rpc DeleteBookmark(RequestDeleteBookmark) returns (ResponseDeleteBookmark);
  // ForgetBookmark forgets the bookmark without deleting the remote bookmarks.
  rpc ForgetBookmark(RequestForgetBookmark) returns (ResponseForgetBookmark);
  rpc TrackBookmark(RequestTrackBookmark) returns (ResponseTrackBookmark);
  rpc UntrackBookmark(RequestUntrackBookmark) returns (ResponseUntrackBookmark);
}

// GitService runs the operations with the remote repositories. The operations return the message of jj in output.
service GitService {
  rpc Fetch(RequestFetch) returns (ResponseFetch);
  // Push pushes the bookmark. The bookmarks of revsets.git-push are pushed if bookmark is empty.
  rpc Push(RequestPush) returns (ResponsePush);
}

message Bookmark {
  string name = 1;
  // remote is empty for the local bookmark.
  string remote   = 2;
  bool   tracked  = 3;
  bool   conflict = 4;
  // synced is true if the local and the tracked remote bookmarks point to the same commit.
  bool synced = 5;
  // target is the commit ID which the bookmark points to. It is empty for the conflicted bookmark.
  string target = 6;
  // ahead and behind are set to the tracked remote bookmark. ahead is the number of the commits of the remote bookmark
  // which the local one doesn't have, and behind is the number of the commits of the local one which the remote one
  // doesn't have.
  int32  ahead       = 7;
  int32  behind      = 8;
  string description = 9;
}

message RequestListBookmarks {
  string path = 1;
}

message ResponseListBookmarks {
  repeated Bookmark bookmarks = 1;
}

message RequestSetBookmark {
  string path     = 1;
  string name     = 2;
  string revision = 3;
}

message ResponseSetBookmark {
  string output = 1;
}

message RequestMoveBookmark {
  string path     = 1;
  string name     = 2;
  string revision = 3;
}

message ResponseMoveBookmark {
  string output = 1;
}

message RequestDeleteBookmark {
  string path = 1;
  string name = 2;
}

message ResponseDeleteBookmark {
  string output = 1;
}

message RequestForgetBookmark {
  string path = 1;
  string name = 2;
}

message ResponseForgetBookmark {
  string output = 1;
}

message RequestTrackBookmark {
  string path   = 1;
  string name   = 2;
  string remote = 3;
}

message ResponseTrackBookmark {
  string output = 1;
}

message RequestUntrackBookmark {
  string path   = 1;
  string name   = 2;
  string remote = 3;
}

message ResponseUntrackBookmark {
  string output = 1;
}

message RequestFetch {
  string path = 1;
}

message ResponseFetch {
  string output = 1;
}

message RequestPush {
  string path     = 1;
  string bookmark = 2;
}

message ResponsePush {
  string output = 1;
}

// OperationService provides the operation log. The operations return the message of jj in output.
service OperationService {
  // ListOperations returns the operations from the newest.
  rpc ListOperations(RequestListOperations) returns (ResponseListOperations);
  // RevertOperation creates the operation which reverts the operation.
  rpc RevertOperation(RequestRevertOperation) returns (ResponseRevertOperation);
  // RestoreOperation restores the repository to the state at the operation.
  rpc RestoreOperation(RequestRestoreOperation) returns (ResponseRestoreOperation);
}

message Operation {
  string id          = 1;
  string description = 2;
  string user        = 3;
  // time is the unix time when the operation started.
  int64 time    = 4;
  bool  current = 5;
}

message RequestListOperations {
  string path = 1;
  // limit is the maximum number of the operations. 0 means no limit.
  int32 limit = 2;
}

message ResponseListOperations {
  repeated Operation operations = 1;
}

message RequestRevertOperation {
  string path = 1;
  string id   = 2;
}

message ResponseRevertOperation {
  string output = 1;
}

message RequestRestoreOperation {
  string path = 1;
  string id   = 2;
}

message ResponseRestoreOperation {
  string output = 1;
}

message EvologEntry {
  string commit_id = 1;
  // timestamp is the unix time of the committer.
  int64           timestamp    = 2;
  string          operation    = 3;
  repeated string predecessors = 4;
  // files is the changes which the version adds relative to its parents.
  repeated FileDiff files = 5;
}

message RequestEvolog {
  string path     = 1;
  string revision = 2;
}

message ResponseEvolog {
  repeated EvologEntry entries = 1;
}

// FileService provides the files at the revision.
service FileService {
  // GetFile returns the content of the file at the revision.
  rpc GetFile(RequestGetFile) returns (ResponseGetFile);
  // ListFiles returns the paths of all files at the revision.
  rpc ListFiles(RequestListFiles) returns (ResponseListFiles);
  // WriteFile writes the file of the working copy. The path must be in the workspace.
  rpc WriteFile(RequestWriteFile) returns (ResponseWriteFile);
}

message RequestGetFile {
  string path     = 1;
  string revision = 2;
  // file is the path of the file relative to the root of the workspace.
  string file = 3;
}

message ResponseGetFile {
  bytes content = 1;
}

message RequestListFiles {
  string path     = 1;
  string revision = 2;
}

message ResponseListFiles {
  repeated string files = 1;
}

message RequestWriteFile {
  string path = 1;
  // file is the path of the file relative to the root of the workspace.
  string file    = 2;
  bytes  content = 3;
}

message ResponseWriteFile {}

// ConflictService provides the conflicts of the mutable revisions.
service ConflictService {
  rpc ListConflicts(RequestListConflicts) returns (ResponseListConflicts);
  // GetConflict returns the conflicted file with the markers of the snapshot style which has the whole content of each
  // side.
  rpc GetConflict(RequestGetConflict) returns (ResponseGetConflict);
  // Resolve resolves the conflict of two sides by taking one side. It returns the message of jj in output.
  rpc Resolve(RequestResolve) returns (ResponseResolve);
}

message ConflictedFile {
  string path = 1;
  // sides is the number of the sides of the conflict. 2 is the conflict between two changes.
  int32 sides = 2;
}

message ConflictedCommit {
  string                  change_id   = 1;
  string                  commit_id   = 2;
  string                  description = 3;
  repeated ConflictedFile files       = 4;
  // working_copy is true if the commit is the working copy. Only the working copy can be resolved by WriteFile.
  bool working_copy = 5;
}

message RequestListConflicts {
  string path = 1;
}

message ResponseListConflicts {
  repeated ConflictedCommit commits = 1;
}

message RequestGetConflict {
  string path     = 1;
  string revision = 2;
  string file     = 3;
}

message ResponseGetConflict {
  string content = 1;
}

enum ResolveSide {
  RESOLVE_SIDE_UNSPECIFIED = 0;
  // RESOLVE_SIDE_OURS takes the first side.
  RESOLVE_SIDE_OURS = 1;
  // RESOLVE_SIDE_THEIRS takes the second side.
  RESOLVE_SIDE_THEIRS = 2;
}

message RequestResolve {
  string      path     = 1;
  string      revision = 2;
  string      file     = 3;
  ResolveSide side     = 4;
}

message ResponseResolve {
  string output = 1;
}

message RequestSplit {
  string path     = 1;
  string revision = 2;
  // description is the description of the new revision which has the files.
  string          description = 3;
  repeated string files       = 4;
}

message ResponseSplit {
  string output = 1;
}

message RequestRestore {
  string          path     = 1;
  string          revision = 2;
  repeated string files    = 3;
}

message ResponseRestore {
  string output = 1;
}

// WorkspaceService manages the workspaces of jj. The operations return the message of jj in output.
service WorkspaceService {
  rpc ListRepositoryWorkspaces(RequestListRepositoryWorkspaces) returns (ResponseListRepositoryWorkspaces);
  // AddRepositoryWorkspace creates the workspace in the sibling directory of the repository.
  rpc AddRepositoryWorkspace(RequestAddRepositoryWorkspace) returns (ResponseAddRepositoryWorkspace);
  // ForgetRepositoryWorkspace stops tracking the workspace. The directory is left. The workspace opened in Codexel
  // can't be forgotten.
  rpc ForgetRepositoryWorkspace(RequestForgetRepositoryWorkspace) returns (ResponseForgetRepositoryWorkspace);
  // RenameRepositoryWorkspace renames the workspace of the repository.
  rpc RenameRepositoryWorkspace(RequestRenameRepositoryWorkspace) returns (ResponseRenameRepositoryWorkspace);
  // UpdateStale updates the stale working copy of the workspace.
  rpc UpdateStale(RequestUpdateStale) returns (ResponseUpdateStale);
}

message RepositoryWorkspace {
  string name = 1;
  // target is the commit ID of the working copy of the workspace.
  string target = 2;
  string root   = 3;
}

message RequestListRepositoryWorkspaces {
  string path = 1;
}

message ResponseListRepositoryWorkspaces {
  repeated RepositoryWorkspace workspaces = 1;
}

message RequestAddRepositoryWorkspace {
  string path     = 1;
  string name     = 2;
  string revision = 3;
}

message ResponseAddRepositoryWorkspace {
  string output = 1;
  // root is the root of the new workspace.
  string root = 2;
}

message RequestForgetRepositoryWorkspace {
  string path = 1;
  string name = 2;
}

message ResponseForgetRepositoryWorkspace {
  string output = 1;
}

message RequestRenameRepositoryWorkspace {
  string path = 1;
  string name = 2;
}

message ResponseRenameRepositoryWorkspace {
  string output = 1;
}

message RequestUpdateStale {
  string path = 1;
}

message ResponseUpdateStale {
  string output = 1;
}

message RequestDiffRange {
  string path = 1;
  string from = 2;
  string to   = 3;
}

message ResponseDiffRange {
  repeated FileDiff files = 1;
}

// AliasService runs the aliases of jj configured by the user.
service AliasService {
  rpc ListAliases(RequestListAliases) returns (ResponseListAliases);
  // RunAlias runs the alias without the arguments. It returns stdout and stderr of jj in output.
  rpc RunAlias(RequestRunAlias) returns (ResponseRunAlias);
}

message Alias {
  string          name = 1;
  repeated string args = 2;
}

message RequestListAliases {
  string path = 1;
}

message ResponseListAliases {
  repeated Alias aliases = 1;
}

message RequestRunAlias {
  string path = 1;
  string name = 2;
}

message ResponseRunAlias {
  string output = 1;
}
